<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>부산 AI 디지털배움터 지점 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --brand:#1d4ed8; --brand-ink:#1e3a8a;
    --t1:#f97316; --t2:#eab308; --t3:#84cc16; --t4:#16a34a;
    --type-exp:#2563eb; --type-hub:#dc2626; --type-both:#9333ea;
    --sidebar-w:340px; --header-h:64px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100%}

  /* Header */
  header{height:var(--header-h);flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 18px;z-index:1200;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
  .htxt h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px}
  .htxt p{margin:1px 0 0;font-size:12px;color:var(--sub)}
  .hmeta{margin-left:auto;display:flex;align-items:center;gap:8px}
  .badge{font-size:11.5px;background:#eff6ff;color:var(--brand-ink);border:1px solid #dbeafe;border-radius:999px;padding:4px 10px;font-weight:700;white-space:nowrap}
  .menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;width:40px;height:40px;font-size:19px;cursor:pointer}

  /* Notice */
  .notice{flex:0 0 auto;background:#fffbeb;border-bottom:1px solid #fde68a;color:#92400e;
    font-size:12.5px;padding:8px 18px;display:flex;align-items:center;gap:8px}
  .notice b{color:#78350f}
  .notice .x{margin-left:auto;border:none;background:transparent;color:#92400e;cursor:pointer;font-size:15px;line-height:1;padding:4px}

  main{flex:1 1 auto;display:flex;min-height:0;position:relative}

  /* Sidebar */
  aside{width:var(--sidebar-w);flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;z-index:1100}
  .search{padding:12px 14px 8px}
  .search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 34px;font-size:14px;
    background:#f8fafc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2394a3b8' stroke-width='2' viewBox='0 0 24 24'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>") no-repeat 11px center}
  .search input:focus{outline:none;border-color:#93c5fd;background-color:#fff}
  .filters{padding:2px 14px 10px;border-bottom:1px solid var(--line)}
  .frow{margin-top:8px}
  .flabel{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px;letter-spacing:.2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;border:1px solid var(--line);background:#fff;color:#334155;border-radius:999px;
    padding:5px 10px;cursor:pointer;user-select:none;transition:.12s}
  .chip:hover{border-color:#cbd5e1}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
  select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:#fff;color:var(--ink)}
  .count{padding:9px 16px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
  .count b{color:var(--ink)}
  .reset{margin-left:auto;font-size:12px;color:var(--brand);cursor:pointer;border:none;background:none;font-weight:700}

  .list{flex:1 1 auto;overflow-y:auto;padding:8px 10px 20px}
  .card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.12s;background:#fff}
  .card:hover{border-color:#bfdbfe;box-shadow:0 2px 8px rgba(37,99,235,.08)}
  .card.active{border-color:var(--brand);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
  .card .top{display:flex;align-items:center;gap:8px}
  .num{width:22px;height:22px;flex:0 0 auto;border-radius:50%;color:#fff;font-size:11.5px;font-weight:800;
    display:grid;place-items:center;box-shadow:0 1px 2px rgba(15,23,42,.25)}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .card h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.2px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:700;flex:0 0 auto}
  .tag.exp{background:#eff6ff;color:#1d4ed8}.tag.hub{background:#fef2f2;color:#b91c1c}.tag.both{background:#faf5ff;color:#7e22ce}
  .card .meta{margin:7px 0 0;font-size:12px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap}
  .card .meta .rate{color:var(--ink);font-weight:700}

  /* Map */
  .mapwrap{flex:1 1 auto;position:relative;min-width:0}
  #map{position:absolute;inset:0}

  /* Legend */
  .legend{position:absolute;left:16px;bottom:16px;z-index:800;background:rgba(255,255,255,.97);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 4px 16px rgba(15,23,42,.12);font-size:12px;max-width:230px;overflow:hidden}
  .legend .lhead{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;font-weight:800;font-size:12.5px}
  .legend .lbody{padding:0 12px 11px;border-top:1px solid var(--line)}
  .legend.collapsed .lbody{display:none}
  .toggle{display:flex;background:#f1f5f9;border-radius:8px;padding:3px;margin:10px 0 4px}
  .toggle button{flex:1;border:none;background:none;font-size:11.5px;padding:5px;border-radius:6px;cursor:pointer;color:var(--sub);font-weight:700}
  .toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
  .lscale{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .lrow{display:flex;align-items:center;gap:8px}
  .lrow .sw{width:13px;height:13px;border-radius:50%;flex:0 0 auto}
  .lrow small{color:var(--sub)}
  .gloss{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--sub);line-height:1.5}

  /* Marker icon */
  .houseIcon{background:none;border:none}
  .pin{position:relative;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
    border:2.5px solid #fff;box-shadow:0 1px 4px rgba(15,23,42,.4);color:#fff;font-size:12px;font-weight:800}
  .pin.ring{box-shadow:0 0 0 3px rgba(147,51,234,.35),0 1px 4px rgba(15,23,42,.4)}
  .pin.sel{width:34px;height:34px;font-size:15px;z-index:1000;box-shadow:0 0 0 4px rgba(37,99,235,.3),0 2px 8px rgba(15,23,42,.5)}

  /* Popup */
  .leaflet-popup-content{margin:0;width:262px!important}
  .pop h4{margin:0;padding:12px 14px 10px;font-size:15px;font-weight:800;background:#f8fafc;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
  .pop .body{padding:11px 14px}
  .pop .tags{display:flex;gap:6px;margin-bottom:9px}
  .pop dl{margin:0;display:grid;grid-template-columns:66px 1fr;gap:5px 8px;font-size:12.5px}
  .pop dt{color:var(--sub)}
  .pop dd{margin:0;color:var(--ink)}
  .pop .perf{margin:11px 0 3px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .pop .perf .ph{font-size:10.5px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:5px;margin-bottom:6px}
  .pop .perf .pv{display:flex;justify-content:space-between;align-items:baseline}
  .pop .perf .big{font-size:20px;font-weight:800}
  .pop .perf .rt{font-size:13px;font-weight:800}
  .pop .warn{font-size:10.5px;color:#92400e;margin-top:6px;line-height:1.4}
  .pop .acts{display:flex;gap:7px;margin-top:11px}
  .pop .acts a{flex:1;text-align:center;font-size:12px;font-weight:700;text-decoration:none;border-radius:9px;padding:8px;border:1px solid var(--line);color:#334155}
  .pop .acts a.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .leaflet-popup-content-wrapper{border-radius:12px;padding:0;overflow:hidden}

  .scrim{display:none}
  @media(max-width:760px){
    :root{--header-h:auto}
    header{flex-wrap:wrap;padding:10px 14px;gap:10px}
    .htxt h1{font-size:15px}
    .hmeta .badge.src{display:none}
    .menu-btn{display:block;order:-1}
    aside{position:absolute;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .25s;box-shadow:4px 0 24px rgba(15,23,42,.18);width:86%;max-width:340px}
    aside.open{transform:none}
    .scrim{display:block;position:absolute;inset:0;background:rgba(15,23,42,.4);z-index:1050;opacity:0;pointer-events:none;transition:.2s}
    .scrim.show{opacity:1;pointer-events:auto}
    .legend{max-width:180px;font-size:11px;left:10px;bottom:10px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="menu-btn" id="menuBtn" aria-label="목록 열기">☰</button>
    <div class="logo">AI</div>
    <div class="htxt">
      <h1>부산 AI 디지털배움터</h1>
      <p>지점 안내 · 구·군별 디지털교육 참여 현황</p>
    </div>
    <div class="hmeta">
      <span class="badge">데이터 기준 2026.3</span>
      <span class="badge src">전 20개 지점</span>
    </div>
  </header>

  <div class="notice" id="notice">
    <span>⚠️</span>
    <span><b>참여 실적은 지점별이 아닌 ‘구·군 전체’ 합계</b>입니다. 같은 구·군의 지점은 동일한 수치가 표시됩니다.</span>
    <button class="x" id="noticeX" aria-label="닫기">✕</button>
  </div>

  <main>
    <aside id="sidebar">
      <div class="search">
        <input id="q" type="search" placeholder="지점명·구·군·주소 검색" autocomplete="off" />
      </div>
      <div class="filters">
        <div class="frow">
          <div class="flabel">구·군</div>
          <select id="guSel"><option value="">전체 구·군</option></select>
        </div>
        <div class="frow">
          <div class="flabel">시설 유형</div>
          <div class="chips" id="typeChips">
            <span class="chip on" data-type="">전체</span>
            <span class="chip" data-type="체험존">체험존</span>
            <span class="chip" data-type="거점센터">거점센터</span>
            <span class="chip" data-type="거점센터·체험존">복합</span>
          </div>
        </div>
        <div class="frow">
          <div class="flabel">참여율 등급</div>
          <div class="chips" id="tierChips">
            <span class="chip on" data-tier="">전체</span>
            <span class="chip" data-tier="4">높음</span>
            <span class="chip" data-tier="3">양호</span>
            <span class="chip" data-tier="2">보통</span>
            <span class="chip" data-tier="1">낮음</span>
          </div>
        </div>
      </div>
      <div class="count"><span><b id="cnt">20</b>개 지점</span><button class="reset" id="reset">필터 초기화</button></div>
      <div class="list" id="list"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="mapwrap">
      <div id="map"></div>
      <div class="legend" id="legend">
        <div class="lhead" id="legendHead"><span>범례 · 지도 보기</span><span id="legChevron">▾</span></div>
        <div class="lbody">
          <div class="toggle" id="colorToggle">
            <button data-mode="tier">참여율로 보기</button>
            <button data-mode="type" class="on">유형으로 보기</button>
          </div>
          <div class="lscale" id="lscale"></div>
          <div class="gloss" id="gloss"></div>
        </div>
      </div>
    </div>
  </main>
</div>

동우체국", "gu": "해운대구", "type": "거점센터·체험존", "addr": "부산광역시 해운대구 중동1로 11", "detail": "7층", "people": "2,674명", "rate": "1.6%", "rateNum": 1.6, "pop": "169,835명", "lat": 35.16393, "lng": 129.161152, "tier": 1}, {"name": "해운대종합사회복지관", "gu": "해운대구", "type": "체험존", "addr": "부산광역시 해운대구 재반로12번길 16", "detail": "-", "people": "2,674명", "rate": "1.6%", "rateNum": 1.6, "pop": "169,835명", "lat": 35.180097, "lng": 129.127639, "tier": 1}];

const TIER = {
  4:{c:'var(--t4)',hex:'#16a34a',label:'높음',range:'7% 이상'},
  3:{c:'var(--t3)',hex:'#84cc16',label:'양호',range:'5–7%'},
  2:{c:'var(--t2)',hex:'#eab308',label:'보통',range:'3–5%'},
  1:{c:'var(--t1)',hex:'#f97316',label:'낮음',range:'3% 미만'},
};
const TYPE = {
  '체험존':{hex:'#2563eb',cls:'exp',short:'체험존'},
  '거점센터':{hex:'#dc2626',cls:'hub',short:'거점센터'},
  '거점센터·체험존':{hex:'#9333ea',cls:'both',short:'복합'},
};

let colorMode='type';
const state={q:'',gu:'',type:'',tier:''};
const markers={}; // name -> marker
let activeName=null;
let numByName={}; // name -> 목록 순번

// ---- Map ----
const map=L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([35.16,129.06],11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {maxZoom:20,subdomains:'abcd',attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

function colorFor(b){ return colorMode==='tier' ? TIER[b.tier].hex : TYPE[b.type].hex; }

// 유형별 건물 실루엣: 체험존=단일지붕 집, 복합=이중지붕 집, 거점센터=타워+깃발
function houseShape(type){
  if(type==='거점센터')
    return {inner:'<path d="M7 14 H33 V46 H7 Z"/><path d="M18.5 2 H21.5 V14 H18.5 Z"/><path d="M21.5 2 L31 5.5 L21.5 9 Z"/>', ny:34};
  if(type==='거점센터·체험존')
    return {inner:'<path d="M3 21 L11 7 L20 21 L29 7 L37 21 L37 46 L3 46 Z"/>', ny:39};
  return {inner:'<path d="M20 3 L37 18 L37 46 L3 46 L3 18 Z"/>', ny:38};
}
function makeIcon(b,selected,number){
  const col=colorFor(b);
  const hp=houseShape(b.type);
  const sz = selected?46:36, h=sz*1.2;
  const glow = selected?' drop-shadow(0 0 5px rgba(37,99,235,.7))':'';
  const svg=`<svg width="${sz}" height="${h}" viewBox="0 0 40 48" style="filter:drop-shadow(0 2px 3px rgba(15,23,42,.45))${glow};overflow:visible">
    <g fill="${col}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">${hp.inner}</g>
    <text x="20" y="${hp.ny}" text-anchor="middle" font-size="16" font-weight="800" fill="#fff"
      style="paint-order:stroke;stroke:rgba(15,23,42,.38);stroke-width:2.4px;font-family:sans-serif">${number||''}</text>
  </svg>`;
  return L.divIcon({className:'houseIcon', html:svg, iconSize:[sz,h], iconAnchor:[sz/2, h*0.96], popupAnchor:[0,-h*0.9]});
}

function popupHtml(b){
  const t=TYPE[b.type];
  const naver=`https://map.naver.com/v5/search/${encodeURIComponent(b.addr)}`;
  const kakao=`https://map.kakao.com/link/to/${encodeURIComponent(b.name)},${b.lat},${b.lng}`;
  return `<div class="pop">
    <h4>${b.name}</h4>
    <div class="body">
      <div class="tags">
        <span class="tag ${t.cls}">${b.type}</span>
        <span class="tag" style="background:#f1f5f9;color:#475569">${b.gu}</span>
      </div>
      <dl>
        <dt>주소</dt><dd>${b.addr}</dd>
        ${b.detail && b.detail!=='-' ? `<dt>상세위치</dt><dd>${b.detail}</dd>`:''}
      </dl>
      <div class="perf">
        <div class="ph">📊 ${b.gu} 전체 디지털교육 실적 <span style="color:#b45309">(지점 개별 아님)</span></div>
        <div class="pv">
          <span class="big" style="color:${TIER[b.tier].hex}">${b.people}</span>
          <span class="rt" style="color:${TIER[b.tier].hex}">참여율 ${b.rate}</span>
        </div>
        <div class="warn">인구 ${b.pop} 대비 · 참여율 등급 <b>${TIER[b.tier].label}</b></div>
      </div>
      <div class="acts">
        <a class="primary" href="${kakao}" target="_blank" rel="noopener">길찾기</a>
        <a href="${naver}" target="_blank" rel="noopener">네이버지도</a>
      </div>
    </div>
  </div>`;
}

BRANCHES.forEach(b=>{
  const m=L.marker([b.lat,b.lng],{icon:makeIcon(b,false,'')}).addTo(map);
  m.bindPopup(popupHtml(b),{closeButton:true});
  m.on('click',()=>setActive(b.name,false));
  m.on('popupclose',()=>{ if(activeName===b.name) setActive(null,false); });
  markers[b.name]=m;
});

function refreshIcons(){
  BRANCHES.forEach(b=>markers[b.name].setIcon(makeIcon(b, b.name===activeName, numByName[b.name])));
}

// ---- Filtering ----
function visible(){
  return BRANCHES.filter(b=>{
    if(state.gu && b.gu!==state.gu) return false;
    if(state.type && b.type!==state.type) return false;
    if(state.tier && String(b.tier)!==state.tier) return false;
    if(state.q){
      const q=state.q.toLowerCase();
      if(!(b.name+b.gu+b.addr+b.type).toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function renderList(){
  const vis=visible();
  vis.sort((a,b)=> b.rateNum-a.rateNum || a.name.localeCompare(b.name));
  // 목록 순번 부여(현재 필터/정렬 기준) → 지도 마커 숫자와 동일
  numByName={};
  vis.forEach((b,i)=>numByName[b.name]=i+1);
  const names=new Set(vis.map(b=>b.name));
  // 마커 표시/숨김 + 번호가 반영된 아이콘 갱신
  BRANCHES.forEach(b=>{
    const el=markers[b.name];
    if(names.has(b.name)){
      el.setIcon(makeIcon(b, b.name===activeName, numByName[b.name]));
      if(!map.hasLayer(el)) el.addTo(map);
    } else if(map.hasLayer(el)){ map.removeLayer(el); }
  });
  document.getElementById('cnt').textContent=vis.length;
  const list=document.getElementById('list');
  if(!vis.length){ list.innerHTML='<div style="padding:24px 12px;text-align:center;color:#94a3b8;font-size:13px">조건에 맞는 지점이 없습니다.</div>'; return; }
  list.innerHTML=vis.map(b=>{
    const t=TYPE[b.type];
    return `<div class="card${b.name===activeName?' active':''}" data-name="${b.name}">
      <div class="top">
        <span class="num" style="background:${colorFor(b)}">${numByName[b.name]}</span>
        <h3>${b.name}</h3>
        <span class="tag ${t.cls}">${t.short}</span>
      </div>
      <div class="meta">
        <span>${b.gu}</span>
        <span class="rate" style="color:${TIER[b.tier].hex}">참여율 ${b.rate}</span>
        <span>${b.people}</span>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click',()=>setActive(c.dataset.name,true));
  });
}

function setActive(name,fly){
  activeName=name;
  refreshIcons();
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.name===name));
  if(name){
    const b=BRANCHES.find(x=>x.name===name);
    const m=markers[name];
    if(fly){ map.flyTo([b.lat,b.lng], Math.max(map.getZoom(),14), {duration:.5}); setTimeout(()=>m.openPopup(),350); closeSidebarMobile(); }
    const card=document.querySelector(`.card[data-name="${CSS.escape(name)}"]`);
    if(card) card.scrollIntoView({block:'nearest'});
  }
}

// ---- Legend ----
function miniHouse(type,color){
  const hp=houseShape(type);
  return `<svg width="17" height="20" viewBox="0 0 40 48" style="overflow:visible;flex:0 0 auto"><g fill="${color||'#94a3b8'}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">${hp.inner}</g></svg>`;
}
function renderLegend(){
  const scale=document.getElementById('lscale');
  const gloss=document.getElementById('gloss');
  if(colorMode==='tier'){
    scale.innerHTML=[4,3,2,1].map(k=>`<div class="lrow"><span class="sw" style="background:${TIER[k].hex}"></span><span><b>${TIER[k].label}</b> <small>참여율 ${TIER[k].range}</small></span></div>`).join('');
  }else{
    scale.innerHTML=Object.entries(TYPE).map(([k,v])=>`<div class="lrow">${miniHouse(k,v.hex)}<span><b>${k}</b></span></div>`).join('');
  }
  gloss.innerHTML=
    `<div style="display:flex;gap:10px;align-items:center;margin-bottom:5px">
       <span style="display:flex;align-items:center;gap:3px">${miniHouse('체험존')}체험존</span>
       <span style="display:flex;align-items:center;gap:3px">${miniHouse('거점센터·체험존')}복합</span>
       <span style="display:flex;align-items:center;gap:3px">${miniHouse('거점센터')}거점센터</span>
     </div>
     <div>모양=시설 유형 · 숫자=목록 순번(참여율 높은 순)</div>`;
}

// ---- Controls wiring ----
const guSel=document.getElementById('guSel');
[...new Set(BRANCHES.map(b=>b.gu))].sort().forEach(g=>{
  const o=document.createElement('option'); o.value=g; o.textContent=g; guSel.appendChild(o);
});
guSel.addEventListener('change',e=>{state.gu=e.target.value;renderList();});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.trim();renderList();});
document.getElementById('typeChips').addEventListener('click',e=>{
  if(!e.target.classList.contains('chip'))return;
  state.type=e.target.dataset.type;
  setChips('typeChips',e.target); renderList();
});
document.getElementById('tierChips').addEventListener('click',e=>{
  if(!e.target.classList.contains('chip'))return;
  state.tier=e.target.dataset.tier;
  setChips('tierChips',e.target); renderList();
});
function setChips(id,on){document.querySelectorAll('#'+id+' .chip').forEach(c=>c.classList.toggle('on',c===on));}
document.getElementById('reset').addEventListener('click',()=>{
  Object.assign(state,{q:'',gu:'',type:'',tier:''});
  document.getElementById('q').value=''; guSel.value='';
  setChips('typeChips',document.querySelector('#typeChips .chip'));
  setChips('tierChips',document.querySelector('#tierChips .chip'));
  renderList();
});
document.getElementById('colorToggle').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  colorMode=e.target.dataset.mode;
  document.querySelectorAll('#colorToggle button').forEach(btn=>btn.classList.toggle('on',btn===e.target));
  refreshIcons(); renderLegend(); renderList();
});
document.getElementById('legendHead').addEventListener('click',()=>{
  const lg=document.getElementById('legend'); lg.classList.toggle('collapsed');
  document.getElementById('legChevron').textContent=lg.classList.contains('collapsed')?'▸':'▾';
});
document.getElementById('noticeX').addEventListener('click',()=>document.getElementById('notice').style.display='none');

// mobile sidebar
const sidebar=document.getElementById('sidebar'), scrim=document.getElementById('scrim');
document.getElementById('menuBtn').addEventListener('click',()=>{sidebar.classList.add('open');scrim.classList.add('show');});
function closeSidebarMobile(){sidebar.classList.remove('open');scrim.classList.remove('show');}
scrim.addEventListener('click',closeSidebarMobile);

// init
renderLegend();
renderList();
</script>
</body>
</html>
